# Compose file for production deployment on Dokploy.

volumes:
  db_data: null
  storage: null

services:
  app:
    # Build from current repo instead of pulling official image
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    # No "ports" section here to avoid host conflict. 
    # Traefik handles external routing via labels.
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_LOCALE: ${APP_LOCALE:-en-US}
      APP_FORCE_TLS: ${APP_FORCE_TLS:-false}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-*}
      SITE_NAME: ${SITE_NAME:-VDOT}
      PRIVATE_FILESYSTEM_DISK: ${PRIVATE_FILESYSTEM_DISK:-local}
      PUBLIC_FILESYSTEM_DISK: ${PUBLIC_FILESYSTEM_DISK:-local_public}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_SOCKET: ${DB_SOCKET:-null}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PREFIX: ${DB_PREFIX:-null}
      DB_DUMP_PATH: ${DB_DUMP_PATH:-/usr/bin}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_IS_PAAS: ${DB_SSL_IS_PAAS:-false}
      DB_SSL_KEY_PATH: ${DB_SSL_KEY_PATH:-null}
      DB_SSL_CERT_PATH: ${DB_SSL_CERT_PATH:-null}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-null}
      DB_SSL_CIPHER: ${DB_SSL_CIPHER:-null}
      DB_SSL_VERIFY_SERVER: ${DB_SSL_VERIFY_SERVER:-null}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_TLS_VERIFY_PEER: ${MAIL_TLS_VERIFY_PEER:-true}
      MAIL_FROM_ADDR: ${MAIL_FROM_ADDR}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_REPLYTO_ADDR: ${MAIL_REPLYTO_ADDR}
      MAIL_REPLYTO_NAME: ${MAIL_REPLYTO_NAME}
      MAIL_AUTO_EMBED_METHOD: ${MAIL_AUTO_EMBED_METHOD:-attachment}
      ALLOW_BACKUP_DELETE: ${ALLOW_BACKUP_DELETE:-false}
      ALLOW_DATA_PURGE: ${ALLOW_DATA_PURGE:-false}
      IMAGE_LIB: ${IMAGE_LIB:-gd}
      BACKUP_ENV: ${BACKUP_ENV:-true}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-12000}
      EXPIRE_ON_CLOSE: ${EXPIRE_ON_CLOSE:-false}
      ENCRYPT: ${ENCRYPT:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-null}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      API_TOKEN_EXPIRATION_YEARS: ${API_TOKEN_EXPIRATION_YEARS:-15}
      ALLOW_IFRAMING: ${ALLOW_IFRAMING:-false}
      REFERRER_POLICY: ${REFERRER_POLICY:-same-origin}
      ENABLE_CSP: ${ENABLE_CSP:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-null}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-sync}
      CACHE_PREFIX: ${CACHE_PREFIX:-snipeit}
      REDIS_HOST: ${REDIS_HOST:-null}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-null}

    # Labels for Traefik routing (Dokploy usually manages these dynamically,
    # but this structure is what you requested).
    labels:
      - traefik.docker.network=dokploy-network
      # Note: The Host() rule and service names below are placeholders.
      # Dokploy usually overwrites these labels when you deploy via its UI.
      - traefik.http.routers.vdot-app.rule=Host(`vdot.your-domain.com`)
      - traefik.http.routers.vdot-app.entrypoints=web
      # Apache inside container listens on port 80
      - traefik.http.services.vdot-app.loadbalancer.server.port=80
      - traefik.http.routers.vdot-app.service=vdot-app
      - traefik.http.routers.vdot-app.middlewares=redirect-to-https@file
      - traefik.http.routers.vdot-app-secure.rule=Host(`vdot.your-domain.com`)
      - traefik.http.routers.vdot-app-secure.entrypoints=websecure
      - traefik.http.services.vdot-app-secure.loadbalancer.server.port=80
      - traefik.http.routers.vdot-app-secure.service=vdot-app-secure
      - traefik.enable=true
    networks:
      - dokploy-network

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
