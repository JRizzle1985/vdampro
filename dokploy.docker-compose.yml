# Compose file for production deployment on Dokploy.
#
# Isolation design:
#   - Each stack has its own "internal" bridge network for app<->db traffic.
#   - The db service is NOT on dokploy-network, so it is invisible to other stacks.
#   - Only the app service joins dokploy-network (for Traefik routing).
#   - Traefik labels use no hardcoded router names — Dokploy overwrites them on deploy.

volumes:
  db_data: null
  storage: null

networks:
  # Shared Traefik network — app only, never db
  dokploy-network:
    external: true
  # Private network scoped to this stack — app + db only
  internal:
    driver: bridge
    internal: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_LOCALE: ${APP_LOCALE:-en-US}
      APP_FORCE_TLS: ${APP_FORCE_TLS:-false}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-*}
      SITE_NAME: ${SITE_NAME:-VDOT}
      PRIVATE_FILESYSTEM_DISK: ${PRIVATE_FILESYSTEM_DISK:-local}
      PUBLIC_FILESYSTEM_DISK: ${PUBLIC_FILESYSTEM_DISK:-local_public}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_SOCKET: ${DB_SOCKET:-null}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PREFIX: ${DB_PREFIX:-null}
      DB_DUMP_PATH: ${DB_DUMP_PATH:-/usr/bin}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_IS_PAAS: ${DB_SSL_IS_PAAS:-false}
      DB_SSL_KEY_PATH: ${DB_SSL_KEY_PATH:-null}
      DB_SSL_CERT_PATH: ${DB_SSL_CERT_PATH:-null}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-null}
      DB_SSL_CIPHER: ${DB_SSL_CIPHER:-null}
      DB_SSL_VERIFY_SERVER: ${DB_SSL_VERIFY_SERVER:-null}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_TLS_VERIFY_PEER: ${MAIL_TLS_VERIFY_PEER:-true}
      MAIL_FROM_ADDR: ${MAIL_FROM_ADDR:-you@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VDOT}
      MAIL_REPLYTO_ADDR: ${MAIL_REPLYTO_ADDR:-you@example.com}
      MAIL_REPLYTO_NAME: ${MAIL_REPLYTO_NAME:-VDOT}
      MAIL_AUTO_EMBED_METHOD: ${MAIL_AUTO_EMBED_METHOD:-attachment}
      ALLOW_BACKUP_DELETE: ${ALLOW_BACKUP_DELETE:-false}
      ALLOW_DATA_PURGE: ${ALLOW_DATA_PURGE:-false}
      IMAGE_LIB: ${IMAGE_LIB:-gd}
      BACKUP_ENV: ${BACKUP_ENV:-true}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-12000}
      EXPIRE_ON_CLOSE: ${EXPIRE_ON_CLOSE:-false}
      ENCRYPT: ${ENCRYPT:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-null}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      API_TOKEN_EXPIRATION_YEARS: ${API_TOKEN_EXPIRATION_YEARS:-15}
      ALLOW_IFRAMING: ${ALLOW_IFRAMING:-false}
      REFERRER_POLICY: ${REFERRER_POLICY:-same-origin}
      ENABLE_CSP: ${ENABLE_CSP:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-null}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-sync}
      CACHE_PREFIX: ${CACHE_PREFIX:-snipeit}
      REDIS_HOST: ${REDIS_HOST:-null}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-null}
    networks:
      - dokploy-network
      - internal

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
    # db is on the internal network ONLY — invisible to other stacks
    networks:
      - internal
